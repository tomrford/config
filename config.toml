[tools]
"aqua:neovim/neovim" = "latest"
"github:tomrford/tasks" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
atuin = "latest"
bat = "latest"
bazelisk = "latest"
bun = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
go = "latest"
lazygit = "latest"
node = "latest"
ripgrep = "latest"
rust = { version = "1.99.1", components = ["rust-analyzer", "rust-src"] }
starship = "latest"
uv = "latest"
zoxide = "latest"

[env]
BUN_INSTALL = "{{env.HOME}}/.bun"
EDITOR = "nvim"
GOPATH = "{{env.HOME}}/code/go"
GOPRIVATE = "github.com/tomrford"
PAGER = "less -FirSwX"
_.path = [
  "~/.cargo/bin",
  "~/.local/bin",
  "~/.bun/bin",
  "/opt/homebrew/bin",
]

[tool_config]
locked = true

[settings]
self_update.auto = "1d"
minimum_release_age = "3d"
minimum_release_age_excludes = ["github:tomrford/tasks"]
dotfiles.root = "~/.config/mise"
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.agents/skills" = { source = "agent-skills/skills" }
"~/.bunfig.toml" = {}
"~/.claude/CLAUDE.md" = { source = ".codex/AGENTS.md" }
"~/.claude/skills" = { source = "agent-skills/skills" }
"~/.codex/AGENTS.md" = {}
"~/.config/git/config" = {}
"~/.config/nvim" = {}
"~/.config/starship.toml" = {}
"~/.config/uv/uv.toml" = {}
"~/.gemini/AGENTS.md" = { source = ".codex/AGENTS.md" }
"~/.gemini/config/skills" = { source = "agent-skills/skills" }
"~/.hushlogin" = {}
# T3 Code runs Antigravity with an isolated --gemini-dir under
# ~/.t3/userdata/providers/antigravity/<sha256(instanceId)>/ (only skills are auto-linked;
# ac0a3dfd... = sha256("antigravity")). Note: config/mcp_config.json is still per-machine.
"~/.t3/userdata/providers/antigravity/ac0a3dfd6dddb20962cecff6ee5fe65e19d3923be20e52c5ab52ff877f7e4c32/AGENTS.md" = { source = ".codex/AGENTS.md" }
"~/.zshenv" = {}
"~/.zshrc" = {}

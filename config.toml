[tools]
"aqua:neovim/neovim" = "latest"
"github:tomrford/grepo" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
atuin = "latest"
bat = "latest"
bazelisk = "latest"
bun = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
go = "latest"
lazygit = "latest"
node = "24"
pnpm = "latest"
ripgrep = "latest"
starship = "latest"
uv = "latest"
zoxide = "latest"
rust = "1.99.0"
deno = "latest"

[env]
EDITOR = "nvim"
PAGER = "less -FirSwX"

[tool_config]
locked = true

[settings]
self_update.auto = "1d"
minimum_release_age = "3d"
dotfiles.root = "~/.config/mise"
dotfiles.default_mode = "symlink"
minimum_release_age_excludes = ["github:tomrford/grepo"]

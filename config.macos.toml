# macOS desktop bootstrap and user configuration.
[bootstrap.packages]
"brew:fish" = "latest"
"brew:git" = "latest"
"brew:mole" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:betterdisplay" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:middleclick" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:tailscale-app" = "latest"
"brew-cask:visual-studio-code" = "latest"

[bootstrap.hooks.final]
run = [
  "mise bootstrap packages prune --manager brew --yes",
  "mise bootstrap packages prune --manager brew-cask --yes",
]

[env]
BUN_INSTALL = "{{env.HOME}}/.bun"
GOPATH = "{{env.HOME}}/code/go"
GOPRIVATE = "github.com/tomrford"
_.path = [
  "~/.cargo/bin",
  "~/.local/bin",
  "~/.local/share/pnpm/bin",
  "/opt/homebrew/bin",
]

[dotfiles]
"~/.config/.bunfig.toml" = {}
"~/.config/fish/conf.d/ssh-agent.fish" = {}
"~/.config/fish/config.fish" = {}
"~/.config/git/allowed_signers" = {}
"~/.config/git/config" = {}
"~/.config/ghostty" = {}
"~/.config/nvim" = {}
"~/.config/pnpm" = {}
"~/.config/starship.toml" = {}
"~/.config/uv" = {}
"~/.hushlogin" = {}
"~/.zshenv" = {}
"~/.zshrc" = {}

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

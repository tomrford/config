# Codex environment overrides for the shared config.toml baseline.
[env]
CI = "true"
MISE_DATA_DIR = "/workspace/.setup/mise"
MISE_STATE_DIR = "/workspace/.setup/state/mise"
PNPM_HOME = "/workspace/.setup/bin"
NODE_USE_ENV_PROXY = "1"
GOPATH = "/workspace/.setup/gopath"
GOCACHE = "/workspace/.setup/cache/go"
UV_CACHE_DIR = "/workspace/.setup/cache/uv"
DENO_DIR = "/workspace/.setup/cache/deno"
npm_config_cache = "/workspace/.setup/cache/npm"
PNPM_CONFIG_STORE_DIR = "/workspace/.setup/pnpm-store"
XDG_DATA_HOME = "/workspace/.setup/data"
XDG_CACHE_HOME = "/workspace/.setup/cache"
CARGO_HOME = "/workspace/.setup/cargo"
RUSTUP_HOME = "/workspace/.setup/rustup"
CARGO_BUILD_JOBS = "3"
_.path = ["/workspace/.setup/bin", "/workspace/.setup/bin/bin", "/workspace/.setup/cargo/bin", "/workspace/.setup/tools/node_modules/.bin"]

[dotfiles]
"/workspace/.setup/env.sh" = { content = '''
export MISE_ENV=codex
export MISE_DATA_DIR=/workspace/.setup/mise
export MISE_CACHE_DIR=/workspace/.setup/cache/mise
export MISE_STATE_DIR=/workspace/.setup/state/mise
export PATH=/workspace/.setup/bin:$PATH
eval "$(/workspace/.setup/bin/mise env -s bash)"
export PATH="$MISE_DATA_DIR/shims:$PATH"
''' }
"~/.bashrc/codex-env" = { line = ". /workspace/.setup/env.sh", position = "prepend" }
"~/.profile/codex-env" = { line = ". /workspace/.setup/env.sh", position = "prepend" }

[bootstrap.mise_shell_activate]
bashrc = "activate"
